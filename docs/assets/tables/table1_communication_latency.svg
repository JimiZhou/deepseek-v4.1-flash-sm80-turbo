<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 335" width="960" height="335">
<defs>
  <style>
    .card-bg { fill: #0d1117; stroke: #30363d; stroke-width: 1px; rx: 12px; }
    .header-bg { fill: #161b22; }
    .row-even { fill: #0d1117; }
    .row-odd { fill: #161b22; }
    .row-divider { stroke: #21262d; stroke-width: 1px; }
    .title { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif; font-size: 16px; font-weight: 700; fill: #58a6ff; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #8b949e; }
    .th { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 600; fill: #c9d1d9; }
    .td { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 13px; fill: #e6edf3; }
    .td-text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #e6edf3; }
    .badge-green { fill: #238636; fill-opacity: 0.25; stroke: #3fb950; stroke-width: 1px; rx: 6px; }
    .badge-green-txt { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", sans-serif; font-size: 12px; font-weight: 700; fill: #3fb950; }
    .badge-red { fill: #da3633; fill-opacity: 0.25; stroke: #f85149; stroke-width: 1px; rx: 6px; }
    .badge-red-txt { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", sans-serif; font-size: 12px; font-weight: 700; fill: #f85149; }
  </style>
</defs>
<rect width="960" height="335" class="card-bg" />
<text x="24" y="32" class="title">双机 16 卡网络与节点通信延迟实测对比</text>
<text x="24" y="52" class="subtitle">针对单 Token 隐藏向量 (14 KB) 与批处理 (16 MB) 的实测耗时对比，证实跨机 AllReduce 是主要时延死穴</text>
<rect x="1" y="80" width="958" height="46" class="header-bg" />
<line x1="1" y1="126" x2="959" y2="126" class="row-divider" stroke-width="2" />
<text x="24" y="108" class="th" >通信路径</text>
<text x="244" y="108" class="th" >传输数据量</text>
<text x="394" y="108" class="th" >底层物理通道</text>
<text x="574" y="108" class="th" >实测单次延迟</text>
<text x="724" y="108" class="th" >40 层解码每步总等待</text>
<rect x="1" y="126" width="958" height="46" class="row-even" />
<line x1="1" y1="172" x2="959" y2="172" class="row-divider" />
<text x="24" y="154" class="td-text" >机内单拍规约 (AllReduce)</text>
<text x="244" y="154" class="td" >14 KB (单Token)</text>
<text x="394" y="154" style="fill="#58a6ff" font-weight="600"" >NVLink (400 GB/s)</text>
<text x="574" y="154" class="td" >8 ~ 15 μs</text>
<text x="724" y="154" class="td" >~0.8 ms</text>
<rect x="1" y="172" width="958" height="46" class="row-odd" />
<line x1="1" y1="218" x2="959" y2="218" class="row-divider" />
<text x="24" y="200" class="td-text" >机内大包传输 (AllReduce)</text>
<text x="244" y="200" class="td" >16 MB (批处理)</text>
<text x="394" y="200" style="fill="#58a6ff" font-weight="600"" >NVLink (400 GB/s)</text>
<text x="574" y="200" class="td" >38 ~ 45 μs</text>
<text x="724" y="200" class="td-text" >— (非解码热路径)</text>
<rect x="1" y="218" width="958" height="46" class="row-even" />
<line x1="1" y1="264" x2="959" y2="264" class="row-divider" />
<text x="24" y="246" class="td-text" >跨机规约 (AllReduce)</text>
<text x="244" y="246" class="td" >14 KB (单Token)</text>
<text x="394" y="246" class="td" >4 轨 400G RoCEv2</text>
<text x="574" y="246" class="td" >200 ~ 350 μs</text>
<rect x="722" y="229" width="176" height="24" class="badge-red" />
<text x="724" y="246" class="badge-red-txt" >20 ~ 28 ms (严重瓶颈)</text>
<rect x="1" y="264" width="958" height="46" class="row-odd" />
<line x1="1" y1="310" x2="959" y2="310" class="row-divider" />
<text x="24" y="292" class="td" >跨机点对点直传 (PP P2P)</text>
<text x="244" y="292" class="td" >14 KB (单Token)</text>
<text x="394" y="292" class="td" >4 轨 400G RoCEv2</text>
<text x="574" y="292" class="td" >12 ~ 18 μs</text>
<rect x="722" y="275" width="154" height="24" class="badge-green" />
<text x="724" y="292" class="badge-green-txt" >~0.015 ms (极轻量)</text>
</svg>