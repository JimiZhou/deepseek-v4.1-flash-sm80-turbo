<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 325" width="930" height="325">
<defs>
  <style>
    .card-bg { fill: #0d1117; stroke: #30363d; stroke-width: 1px; rx: 12px; }
    .header-bg { fill: #161b22; }
    .row-even { fill: #0d1117; }
    .row-odd { fill: #161b22; }
    .row-divider { stroke: #21262d; stroke-width: 1px; }
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 16px; font-weight: 700; fill: #58a6ff; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #8b949e; }
    .th { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 600; fill: #c9d1d9; }
    .td { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 13px; fill: #e6edf3; }
    .td-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #e6edf3; }
    .badge-green { fill: #238636; fill-opacity: 0.2; stroke: #3fb950; stroke-width: 1px; rx: 6px; }
    .badge-green-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 12px; font-weight: 700; fill: #3fb950; }
    .badge-red { fill: #da3633; fill-opacity: 0.2; stroke: #f85149; stroke-width: 1px; rx: 6px; }
    .badge-red-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 12px; font-weight: 700; fill: #f85149; }
    .badge-blue { fill: #1f6feb; fill-opacity: 0.2; stroke: #58a6ff; stroke-width: 1px; rx: 6px; }
    .badge-blue-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 12px; font-weight: 600; fill: #58a6ff; }
  </style>
</defs>
<rect width="930" height="325" class="card-bg" />
<text x="24" y="32" class="title">双机 16 卡网络与节点通信延迟实测对比</text>
<text x="24" y="52" class="subtitle">针对单 Token 隐藏向量 (14 KB) 与批处理 (16 MB) 的实测耗时对比，证实跨机 AllReduce 是主要时延死穴</text>
<rect x="1" y="80" width="928" height="44" class="header-bg" />
<line x1="1" y1="124" x2="929" y2="124" class="row-divider" stroke-width="2" />
<text x="24" y="107" class="th" >通信路径</text>
<text x="234" y="107" class="th" >传输数据量</text>
<text x="384" y="107" class="th" >底层物理通道</text>
<text x="564" y="107" class="th" >实测单次延迟</text>
<text x="714" y="107" class="th" >40 层解码每步总等待</text>
<rect x="1" y="124" width="928" height="44" class="row-even" />
<line x1="1" y1="168" x2="929" y2="168" class="row-divider" />
<text x="24" y="150" class="td-text" >机内单拍规约 (AllReduce)</text>
<text x="234" y="150" class="td" >14 KB (单Token)</text>
<text x="384" y="150" class="td" >NVLink (400 GB/s)</text>
<text x="564" y="150" class="td" >8 ~ 15 μs</text>
<text x="714" y="150" class="td" >~0.8 ms</text>
<rect x="1" y="168" width="928" height="44" class="row-odd" />
<line x1="1" y1="212" x2="929" y2="212" class="row-divider" />
<text x="24" y="194" class="td-text" >机内大包传输 (AllReduce)</text>
<text x="234" y="194" class="td" >16 MB (批处理)</text>
<text x="384" y="194" class="td" >NVLink (400 GB/s)</text>
<text x="564" y="194" class="td" >38 ~ 45 μs</text>
<text x="714" y="194" class="td-text" >— (非解码热路径)</text>
<rect x="1" y="212" width="928" height="44" class="row-even" />
<line x1="1" y1="256" x2="929" y2="256" class="row-divider" />
<text x="24" y="238" class="td-text" >跨机规约 (AllReduce)</text>
<text x="234" y="238" class="td" >14 KB (单Token)</text>
<text x="384" y="238" class="td" >4 轨 400G RoCEv2</text>
<text x="564" y="238" class="td" >200 ~ 350 μs</text>
<rect x="712" y="222" width="152" height="24" class="badge-red" />
<text x="714" y="238" class="badge-red-txt" >20 ~ 28 ms (严重瓶颈)</text>
<rect x="1" y="256" width="928" height="44" class="row-odd" />
<line x1="1" y1="300" x2="929" y2="300" class="row-divider" />
<text x="24" y="282" class="td" >跨机点对点直传 (PP P2P)</text>
<text x="234" y="282" class="td" >14 KB (单Token)</text>
<text x="384" y="282" class="td" >4 轨 400G RoCEv2</text>
<text x="564" y="282" class="td" >12 ~ 18 μs</text>
<rect x="712" y="266" width="136" height="24" class="badge-green" />
<text x="714" y="282" class="badge-green-txt" >~0.015 ms (极轻量)</text>
</svg>