<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 237" width="1000" height="237">
<defs>
  <style>
    .card-bg { fill: #0d1117; stroke: #30363d; stroke-width: 1px; rx: 12px; }
    .header-bg { fill: #161b22; }
    .row-even { fill: #0d1117; }
    .row-odd { fill: #161b22; }
    .row-divider { stroke: #21262d; stroke-width: 1px; }
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 16px; font-weight: 700; fill: #58a6ff; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #8b949e; }
    .th { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 600; fill: #c9d1d9; }
    .td { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 13px; fill: #e6edf3; }
    .td-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #e6edf3; }
    .badge-green { fill: #238636; fill-opacity: 0.2; stroke: #3fb950; stroke-width: 1px; rx: 6px; }
    .badge-green-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 12px; font-weight: 700; fill: #3fb950; }
    .badge-red { fill: #da3633; fill-opacity: 0.2; stroke: #f85149; stroke-width: 1px; rx: 6px; }
    .badge-red-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 12px; font-weight: 700; fill: #f85149; }
    .badge-blue { fill: #1f6feb; fill-opacity: 0.2; stroke: #58a6ff; stroke-width: 1px; rx: 6px; }
    .badge-blue-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 12px; font-weight: 600; fill: #58a6ff; }
  </style>
</defs>
<rect width="1000" height="237" class="card-bg" />
<text x="24" y="32" class="title">DSpark 投机解码单并发验证步表现 (C = 1)</text>
<text x="24" y="52" class="subtitle">单步验证耗时稳定在 18ms，代码补全与逻辑推理命中带出 ~2.8 Token，折合单流 ~154 tokens/s</text>
<rect x="1" y="80" width="998" height="44" class="header-bg" />
<line x1="1" y1="124" x2="999" y2="124" class="row-divider" stroke-width="2" />
<text x="24" y="107" class="th" >验证步指标项</text>
<text x="264" y="107" class="th" >Stock SM80 基线</text>
<text x="464" y="107" class="th" >Native Specialized 优化后</text>
<text x="704" y="107" class="th" >表现说明</text>
<rect x="1" y="124" width="998" height="44" class="row-even" />
<line x1="1" y1="168" x2="999" y2="168" class="row-divider" />
<text x="24" y="150" class="td-text" >全模型单步耗时 (T_step)</text>
<text x="264" y="150" class="td" >18.05 ms</text>
<text x="464" y="150" class="td" >18.38 ms</text>
<text x="704" y="150" class="td-text" >毫秒级相当，保持高度稳定</text>
<rect x="1" y="168" width="998" height="44" class="row-odd" />
<line x1="1" y1="212" x2="999" y2="212" class="row-divider" />
<text x="24" y="194" class="td-text" >DSpark 爆发等效 TPOT</text>
<text x="264" y="194" class="td" >6.60 ms / 字</text>
<text x="464" y="194" class="td" >6.56 ms / 字</text>
<rect x="702" y="178" width="224" height="24" class="badge-green" />
<text x="704" y="194" class="badge-green-txt" >相当于单流 ~154 tokens/s (极度跟手)</text>
</svg>