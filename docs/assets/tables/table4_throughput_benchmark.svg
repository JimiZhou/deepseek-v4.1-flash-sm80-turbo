<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 325" width="940" height="325">
<defs>
  <style>
    .card-bg { fill: #0d1117; stroke: #30363d; stroke-width: 1px; rx: 12px; }
    .header-bg { fill: #161b22; }
    .row-even { fill: #0d1117; }
    .row-odd { fill: #161b22; }
    .row-divider { stroke: #21262d; stroke-width: 1px; }
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 16px; font-weight: 700; fill: #58a6ff; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #8b949e; }
    .th { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 600; fill: #c9d1d9; }
    .td { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 13px; fill: #e6edf3; }
    .td-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #e6edf3; }
    .badge-green { fill: #238636; fill-opacity: 0.2; stroke: #3fb950; stroke-width: 1px; rx: 6px; }
    .badge-green-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 12px; font-weight: 700; fill: #3fb950; }
    .badge-red { fill: #da3633; fill-opacity: 0.2; stroke: #f85149; stroke-width: 1px; rx: 6px; }
    .badge-red-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 12px; font-weight: 700; fill: #f85149; }
    .badge-blue { fill: #1f6feb; fill-opacity: 0.2; stroke: #58a6ff; stroke-width: 1px; rx: 6px; }
    .badge-blue-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 12px; font-weight: 600; fill: #58a6ff; }
  </style>
</defs>
<rect width="940" height="325" class="card-bg" />
<text x="24" y="32" class="title">端到端并发与聚合吞吐实测对比矩阵 (Aggregate Throughput)</text>
<text x="24" y="52" class="subtitle">相同 Prompt 输入与流式 SSE Delta 实测，中并发 C=8 下原生优化提升整机吞吐 +16.8%</text>
<rect x="1" y="80" width="938" height="44" class="header-bg" />
<line x1="1" y1="124" x2="939" y2="124" class="row-divider" stroke-width="2" />
<text x="124.0" y="107" class="th" text-anchor="middle">并发度 (Concurrency)</text>
<text x="324.0" y="107" class="th" text-anchor="middle">基线吞吐 (Stock SM80)</text>
<text x="554.0" y="107" class="th" text-anchor="middle">优化后吞吐 (Native Specialized)</text>
<text x="684" y="107" class="th" >吞吐变化趋势</text>
<rect x="1" y="124" width="938" height="44" class="row-even" />
<line x1="1" y1="168" x2="939" y2="168" class="row-divider" />
<text x="124.0" y="150" class="td" text-anchor="middle">C = 1</text>
<text x="324.0" y="150" class="td" text-anchor="middle">48.13 tok/s</text>
<text x="554.0" y="150" class="td" text-anchor="middle">46.98 tok/s</text>
<text x="684" y="150" class="td" >-2.3% (极低并发基本持平)</text>
<rect x="1" y="168" width="938" height="44" class="row-odd" />
<line x1="1" y1="212" x2="939" y2="212" class="row-divider" />
<text x="124.0" y="194" class="td" text-anchor="middle">C = 2</text>
<text x="324.0" y="194" class="td" text-anchor="middle">77.80 tok/s</text>
<text x="554.0" y="194" class="td" text-anchor="middle">74.07 tok/s</text>
<text x="684" y="194" class="td-text" >稳健翻倍扩展</text>
<rect x="1" y="212" width="938" height="44" class="row-even" />
<line x1="1" y1="256" x2="939" y2="256" class="row-divider" />
<text x="124.0" y="238" class="td" text-anchor="middle">C = 8</text>
<text x="324.0" y="238" class="td" text-anchor="middle">181.46 tok/s</text>
<text x="554.0" y="238" class="td" text-anchor="middle">211.98 tok/s</text>
<rect x="682" y="222" width="136" height="24" class="badge-green" />
<text x="684" y="238" class="badge-green-txt" >+16.8% (算子融合提速)</text>
<rect x="1" y="256" width="938" height="44" class="row-odd" />
<line x1="1" y1="300" x2="939" y2="300" class="row-divider" />
<text x="124.0" y="282" class="td" text-anchor="middle">C = 16</text>
<text x="324.0" y="282" class="td" text-anchor="middle">267.32 tok/s</text>
<text x="554.0" y="282" class="td" text-anchor="middle">249.58 tok/s</text>
<text x="684" y="282" class="td-text" >高并发饱和无断崖</text>
</svg>