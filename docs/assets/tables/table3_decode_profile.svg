<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 381" width="1040" height="381">
<defs>
  <style>
    .card-bg { fill: #0d1117; stroke: #30363d; stroke-width: 1px; rx: 12px; }
    .header-bg { fill: #161b22; }
    .row-even { fill: #0d1117; }
    .row-odd { fill: #161b22; }
    .row-divider { stroke: #21262d; stroke-width: 1px; }
    .title { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif; font-size: 16px; font-weight: 700; fill: #58a6ff; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #8b949e; }
    .th { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 600; fill: #c9d1d9; }
    .td { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 13px; fill: #e6edf3; }
    .td-text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #e6edf3; }
    .badge-green { fill: #238636; fill-opacity: 0.25; stroke: #3fb950; stroke-width: 1px; rx: 6px; }
    .badge-green-txt { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", sans-serif; font-size: 12px; font-weight: 700; fill: #3fb950; }
    .badge-red { fill: #da3633; fill-opacity: 0.25; stroke: #f85149; stroke-width: 1px; rx: 6px; }
    .badge-red-txt { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", sans-serif; font-size: 12px; font-weight: 700; fill: #f85149; }
  </style>
</defs>
<rect width="1040" height="381" class="card-bg" />
<text x="24" y="32" class="title">DeepSeek-V4.1 解码关键路径各算子耗时分解与瓶颈分析</text>
<text x="24" y="52" class="subtitle">PyTorch + CUDA Event 逐层 Profiling，证明 MoE 细碎小 GEMM 调度与中间暂存主导了 76.8% 的解码耗时</text>
<rect x="1" y="80" width="1038" height="46" class="header-bg" />
<line x1="1" y1="126" x2="1039" y2="126" class="row-divider" stroke-width="2" />
<text x="24" y="108" class="th" >解码核心算子 / 阶段</text>
<text x="244" y="108" class="th" >每层单次耗时 (μs)</text>
<text x="384" y="108" class="th" >全局时间占比</text>
<text x="504" y="108" class="th" >计算与访存特征</text>
<text x="714" y="108" class="th" >核心瓶颈诊断</text>
<rect x="1" y="126" width="1038" height="46" class="row-even" />
<line x1="1" y1="172" x2="1039" y2="172" class="row-divider" />
<text x="24" y="154" class="td" >MoE 专家计算 (Top-6 GEMM)</text>
<text x="244" y="154" class="td" >1,278 μs</text>
<text x="384" y="154" class="td" >76.8%</text>
<text x="504" y="154" class="td-text" >计算密集 + 小分块访存</text>
<text x="714" y="154" style="fill="#f85149" font-weight="600"" >小 Batch 调度碎片化，SM 利用率不足 5%</text>
<rect x="1" y="172" width="1038" height="46" class="row-odd" />
<line x1="1" y1="218" x2="1039" y2="218" class="row-divider" />
<text x="24" y="200" class="td-text" >Sparse MLA Decode Attention</text>
<text x="244" y="200" class="td" >157 μs</text>
<text x="384" y="200" class="td" >9.5%</text>
<text x="504" y="200" class="td-text" >访存密集 (KV读取)</text>
<text x="714" y="200" class="td-text" >SWA 动态元数据构建分支多，全局访存搬运重</text>
<rect x="1" y="218" width="1038" height="46" class="row-even" />
<line x1="1" y1="264" x2="1039" y2="264" class="row-divider" />
<text x="24" y="246" class="td-text" >Mega-mHC 混合规约</text>
<text x="244" y="246" class="td" >93 μs</text>
<text x="384" y="246" class="td" >2.8%</text>
<text x="504" y="246" class="td-text" >规约密集</text>
<text x="714" y="246" class="td-text" >跨 Warp 累加与中间张量写回开销</text>
<rect x="1" y="264" width="1038" height="46" class="row-odd" />
<line x1="1" y1="310" x2="1039" y2="310" class="row-divider" />
<text x="24" y="292" class="td-text" >DSpark 串行采样步 (每步)</text>
<text x="244" y="292" class="td" >59 μs</text>
<text x="384" y="292" class="td" >1.8%</text>
<text x="504" y="292" class="td-text" >延迟敏感 (串行小算子)</text>
<text x="714" y="292" class="td-text" >多轮 Argmax + 偏置导致 CPU/GPU 调度气泡</text>
<rect x="1" y="310" width="1038" height="46" class="row-even" />
<line x1="1" y1="356" x2="1039" y2="356" class="row-divider" />
<text x="24" y="338" class="td-text" >Dense QKV 线性投影</text>
<text x="244" y="338" class="td" >56 μs</text>
<text x="384" y="338" class="td" >1.7%</text>
<text x="504" y="338" class="td-text" >规整 GEMV</text>
<text x="714" y="338" class="td" >BF16 算力相对充足，耗时稳定</text>
</svg>